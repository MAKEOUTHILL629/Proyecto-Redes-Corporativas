[options]
; Configuración de Odoo para Chispitas: Fábrica de Momentos
; ========================================================

; Database settings
db_host = postgres-odoo
db_port = 5432
db_user = odoo_user
db_password = False
db_name = False
db_template = template0

; Server settings
http_port = 8069
http_interface = 0.0.0.0

; Logging
log_level = info
logfile = /var/log/odoo/odoo.log

; Performance
workers = 4
max_cron_threads = 2
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 600
limit_time_real = 1200

; Internacionalización
without_demo = True
list_db = True
admin_passwd = ${ODOO_MASTER_PASSWORD}

; Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; LDAP/FreeIPA Integration (Descomentar y configurar después de FreeIPA)
; [ldap]
; ldap_server = ipa.chispitas.local
; ldap_server_port = 389
; ldap_binddn = uid=admin,cn=users,cn=accounts,dc=chispitas,dc=local
; ldap_password = ${FREEIPA_ADMIN_PASSWORD}
; ldap_base = cn=users,cn=accounts,dc=chispitas,dc=local
; ldap_filter = (uid=%s)
