# -----------------------------------------------------------------------------
# Share: Homes (Carpetas personales)
# Acceso: Cada usuario a su propia carpeta
# -----------------------------------------------------------------------------
[homes]
    comment = Carpetas Personales de Usuarios
    browseable = no
    writable = yes
    create mask = 0700
    directory mask = 0700
    valid users = %S
