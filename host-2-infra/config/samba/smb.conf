# Configuración de Samba para Chispitas: Fábrica de Momentos
# Integrado con FreeIPA (LDAP/Kerberos)

[global]
    # Configuración básica
    workgroup = CHISPITAS
    realm = CHISPITAS.LOCAL
    netbios name = FILES-SVR
    server string = Servidor de Archivos Chispitas
    
    # Configuración de seguridad
    security = user
    passdb backend = ldapsam:ldap://192.168.1.10
    ldap suffix = dc=chispitas,dc=local
    ldap user suffix = cn=users,cn=accounts
    ldap group suffix = cn=groups,cn=accounts
    ldap machine suffix = cn=computers,cn=accounts
    ldap admin dn = uid=admin,cn=users,cn=accounts,dc=chispitas,dc=local
    ldap ssl = off
    ldap passwd sync = yes
    
    # Configuración de Kerberos (opcional, para SSO)
    # kerberos method = system keytab
    # dedicated keytab file = /etc/samba/samba.keytab
    
    # Configuración de red
    interfaces = 172.20.2.20 lo
    bind interfaces only = yes
    hosts allow = 192.168.1.0/24 172.20.0.0/16 127.0.0.1
    hosts deny = 0.0.0.0/0
    
    # Logging
    log file = /var/log/samba/%m.log
    log level = 2
    max log size = 50
    
    # Performance
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
    read raw = yes
    write raw = yes
    oplocks = yes
    max xmit = 65535
    dead time = 15
    
    # Charset
    unix charset = UTF-8
    dos charset = CP850
    
    # Printing (deshabilitado)
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    
    # Misc
    dns proxy = no
    server role = standalone server
    map to guest = never
    obey pam restrictions = no

# =============================================================================
# RECURSOS COMPARTIDOS (SHARES)
# =============================================================================

# -----------------------------------------------------------------------------
# Share: Producción
# Acceso: GRP_Produccion (Lectura/Escritura)
# -----------------------------------------------------------------------------
[Produccion]
    comment = Área de Producción - Archivos de Manufactura
    path = /shares/Produccion
    browseable = yes
    writable = yes
    guest ok = no
    valid users = @GRP_Produccion @GRP_Admins_Dominio
    write list = @GRP_Produccion @GRP_Admins_Dominio
    read list = @GRP_Produccion @GRP_Admins_Dominio
    create mask = 0770
    directory mask = 0770
    force group = GRP_Produccion
    veto files = /*.exe/*.com/*.bat/*.cmd/
    
# -----------------------------------------------------------------------------
# Share: Comercial
# Acceso: GRP_Comercial (Lectura/Escritura)
